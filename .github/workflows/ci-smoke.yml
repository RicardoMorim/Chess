name: CI Smoke — Lightning quickstart

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Cython extension
        run: |
          python compile_cython.py

      - name: Run smoke import
        run: |
          python tools/smoke_import.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Lightning quickstart (fast)
        run: |
          python train/run_lightning_quickstart.py --epochs 1 --batch-size 4 --seed 42
